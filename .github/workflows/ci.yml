name: API and container
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --locked --no-dev --group test
      - run: uv run --no-dev --group test ruff check src tests train.py predict.py
      - run: uv run --no-dev --group test mypy src train.py predict.py --check-untyped-defs --ignore-missing-imports
      - run: uv run --no-dev --group test pytest --cov=spotify_popularity.api --cov=spotify_popularity.model --cov-branch --cov-fail-under=95 --cov-report=xml --junitxml=test-results.xml
        env:
          TEST_MODEL_PATH: models/model.joblib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
      - run: docker build -t spotify-test .
      - run: |
          docker run -d --name api -p 9696:9696 spotify-test
          trap 'docker logs api; docker rm -f api' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://localhost:9696/health
          python -c 'import json; p=json.load(open("examples/track.json")); p["genres"]=["acoustic"]; json.dump(p,open("/tmp/request.json","w"))'
          curl --fail -X POST http://localhost:9696/predict -H 'Content-Type: application/json' --data-binary @/tmp/request.json
  full-training:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev python train.py
      - uses: actions/upload-artifact@v4
        with:
          name: training-metrics
          path: models/metrics.json
