[project]
name = "spotify-popularity"
version = "0.1.0"
description = "Predict Spotify track popularity and hit probability from audio features and genres."
readme = "README.md"
authors = [
    { name = "Pavel Kalmykov Razgovorov", email = "9091619+pavel-kalmykov@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]
test = [
    "flake8>=7.5.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[project.scripts]
spotify-popularity = "spotify_popularity.training:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
