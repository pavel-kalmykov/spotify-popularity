[project]
name = "spotify-popularity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Kalmykov Razgovorov", email = "9091619+pavel-kalmykov@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
spotify-popularity = "spotify_popularity:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
